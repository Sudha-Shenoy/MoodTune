{% extends "base.html" %}

{% block title %}Create Account – MoodTune{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-glow" aria-hidden="true"></div>
    <div class="auth-card glass-panel">
        <div class="auth-header text-center">
            <div class="auth-icon-wrap" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join MoodTune for music curated to your mood and language.</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form" novalidate>
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <div class="input-wrap">
                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-input"
                        placeholder="John Doe"
                        value="{{ name or '' }}"
                        required
                        minlength="2"
                        maxlength="100"
                        autocomplete="name"
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-wrap">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="you@example.com"
                        value="{{ email or '' }}"
                        required
                        autocomplete="email"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="At least 8 characters"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >
                </div>
                <span class="form-hint">Must be at least 8 characters long.</span>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="input-wrap">
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-input"
                        placeholder="Re-enter your password"
                        required
                        autocomplete="new-password"
                    >
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg auth-submit-btn">
                <span>Create Account</span>
                <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="auth-footer text-center">
            <p class="auth-switch-text">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" class="auth-switch-link">Login</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
