{% extends "base.html" %}

{% block title %}Login – MoodTune{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-glow" aria-hidden="true"></div>
    <div class="auth-card glass-panel">
        <div class="auth-header text-center">
            <div class="auth-icon-wrap" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to resume your personalized music discovery.</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form" novalidate>
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-wrap">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="you@example.com"
                        value="{{ email or '' }}"
                        required
                        autocomplete="email"
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg auth-submit-btn">
                <span>Login</span>
                <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="auth-footer text-center">
            <p class="auth-switch-text">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}" class="auth-switch-link">Create one</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
